name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare settings
        run: |
          mkdir -p profile-3d-contrib
          cat > profile-3d-contrib/settings.json << 'EOL'
          {
            "type": "rainbow",
            "backgroundColor": "#0d1117",
            "foregroundColor": "#dddddd",
            "strongColor": "#ffffff",
            "weakColor": "#888888",
            "radarColor": "#7C3AED",
            "growingAnimation": true,
            "contribColors": [
              "#161b22",
              "#2D1B69",
              "#5B21B6",
              "#7C3AED",
              "#06B6D4"
            ]
          }
          EOL

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib || true
          git diff --staged --quiet || git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore: update 3D contribution graph"
          git push